name: Rust simulator and Docker images

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked --all-targets
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  image-tests:
    needs: rust-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }} candidate
        run: >-
          docker buildx build
          --platform ${{ matrix.platform }}
          --load
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          -t "firmware-simulator:test-${{ matrix.suffix }}"
          .
      - name: Test all packaged STM32 families
        run: scripts/test-image.sh "firmware-simulator:test-${{ matrix.suffix }}"

  publish:
    if: github.event_name == 'push'
    needs: image-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish repository-linked multi-architecture image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          tags=(-t "$IMAGE:${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=(-t "$IMAGE:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "${tags[@]}" --push .
